<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>模糊正方形背景 示例</title>
  <style>
    /* 基本重置 */
    *{box-sizing:border-box;margin:0;padding:0}
    html,body,#app{height:100%}
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,'PingFang SC','Hiragino Sans',"Helvetica Neue",Arial;
      background:#0b0f14; /* 页面主底色，可改 */
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    /* 全屏容器 */
    .hero{
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden; /* 隐藏溢出块 */
      padding:40px;
    }

    /* 背景层：放置多个正方形元素 */
    .bg-layer{
      position:absolute;
      inset:0; /* top:0;right:0;bottom:0;left:0 */
      pointer-events:none; /* 不影响页面交互 */
    }

    /* 每一个正方形块 */
    .bg-square{
      position:absolute;
      width:240px;     /* 基础大小，可用data-size覆盖 */
      height:240px;
      background:linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      transform: translate3d(0,0,0);
      filter: blur(36px);        /* 关键：模糊强度 */
      border-radius:6px;        /* 可改成0获得硬边 */
      mix-blend-mode:screen;    /* 让颜色叠加更柔和 */
      will-change:transform,opacity;
      opacity:0.9;
      /* 可选阴影增强立体感 */
      box-shadow: 0 30px 60px rgba(2,6,23,0.6);
    }

    /* 给每个块提供不同的渐变色（也可通过 inline style 控制） */
    .c1{background:linear-gradient(135deg, rgba(10,180,200,0.26), rgba(10,180,200,0.06));}
    .c2{background:linear-gradient(135deg, rgba(120,60,255,0.22), rgba(120,60,255,0.04));}
    .c3{background:linear-gradient(135deg, rgba(0,200,120,0.22), rgba(0,200,120,0.04));}
    .c4{background:linear-gradient(135deg, rgba(255,110,90,0.18), rgba(255,110,90,0.02));}

    /* 小的适配：当屏幕较小时缩小块和模糊 */
    @media (max-width:720px){
      .bg-square{width:140px;height:140px;filter:blur(22px)}
    }

    /* 简单的缓慢漂浮动画 */
    @keyframes floaty{
      0%{transform:translate3d(var(--tx,0),var(--ty,0),0) rotate(var(--r,0deg))}
      50%{transform:translate3d(calc(var(--tx,0) + var(--dx,0)), calc(var(--ty,0) + var(--dy,0)),0) rotate(calc(var(--r,0deg) + 6deg))}
      100%{transform:translate3d(var(--tx,0),var(--ty,0),0) rotate(var(--r,0deg))}
    }
    .bg-square.animated{animation:floaty var(--dur,18s) ease-in-out infinite}

    /* 页面内容示例 */
    .card{
      position:relative; /* 保证在背景之上 */
      z-index:2;
      max-width:920px;
      width:100%;
      background:rgba(255,255,255,0.02);
      backdrop-filter: blur(6px);
      border:1px solid rgba(255,255,255,0.04);
      padding:48px;
      border-radius:12px;
      box-shadow:0 10px 30px rgba(2,6,23,0.6);
      text-align:center;
    }
    .card h1{font-size:32px;margin-bottom:8px}
    .card p{opacity:0.9}

    /* z-index 较低的淡色覆盖层，增强深度感 */
    .vignette{
      position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.6) 70%);
    }
  </style>
</head>
<body>
  <div id="app">
    <section class="hero">

      <!-- 背景层：添加若干模糊正方形。可以复制更多元素或在 JS 中生成 -->
      <div class="bg-layer" aria-hidden="true">
        <div class="bg-square c1 animated" style="--tx: -18vw; --ty: -8vh; --dx: 6vw; --dy: 5vh; --dur:20s; --r:3deg;"></div>
        <div class="bg-square c2 animated" style="--tx: 28vw; --ty: -22vh; --dx: -8vw; --dy: 9vh; --dur:26s; --r:-4deg; width:340px;height:340px; filter:blur(56px);"></div>
        <div class="bg-square c3 animated" style="--tx:-6vw; --ty:26vh; --dx: 4vw; --dy: -6vh; --dur:22s; --r:2deg; width:220px;height:220px; filter:blur(30px);"></div>
        <div class="bg-square c4 animated" style="--tx:20vw; --ty:18vh; --dx:-5vw; --dy:-4vh; --dur:30s; --r:0deg; width:180px;height:180px; filter:blur(28px);"></div>
      </div>

      <div class="vignette"></div>

      <!-- 页面主要内容示例 -->
      <div class="card">
        <h1>模糊正方形背景效果</h1>
        <p>一个可定制、响应式的模糊正方形背景示例。把这段代码保存为 <code>index.html</code> 并在浏览器中打开即可查看。</p>
        <p style="margin-top:12px;opacity:0.8;font-size:13px">提示：通过修改 <code>.bg-square</code> 的 <code>filter: blur()</code>、大小、渐变颜色或动画变量可以快速获得不同风格。</p>
      </div>

    </section>
  </div>

  <script>
    // 可选：用 JS 在页面载入时随机摆放更多方块
    (function(){
      const layer = document.querySelector('.bg-layer');
      // 如果屏幕较小则不追加，避免性能问题
      if(window.innerWidth < 600) return;

      const colors = ['c1','c2','c3','c4'];
      for(let i=0;i<3;i++){
        const el = document.createElement('div');
        el.className='bg-square animated ' + colors[Math.floor(Math.random()*colors.length)];
        const size = 120 + Math.floor(Math.random()*260);
        const tx = (Math.random()*140-70).toFixed(2) + 'vw';
        const ty = (Math.random()*140-70).toFixed(2) + 'vh';
        const dx = (Math.random()*10-5).toFixed(2) + 'vw';
        const dy = (Math.random()*10-5).toFixed(2) + 'vh';
        const dur = (18 + Math.random()*16).toFixed(2) + 's';
        const blur = 20 + Math.floor(Math.random()*60);
        const rot = (Math.random()*12-6).toFixed(2) + 'deg';
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.filter = `blur(${blur}px)`;
        el.style.setProperty('--tx', tx);
        el.style.setProperty('--ty', ty);
        el.style.setProperty('--dx', dx);
        el.style.setProperty('--dy', dy);
        el.style.setProperty('--dur', dur);
        el.style.setProperty('--r', rot);
        layer.appendChild(el);
      }
    })();
  </script>
  <!-- 新增：不规则方形（左上 & 右下缺角）示例 -->
  <style>
    .irregular-square {
      position:absolute;
      width:260px;
      height:260px;
      background: rgba(255,255,255,0.06); /* 半透明前景 */
      backdrop-filter: blur(40px); /* 关键：模糊下面的背景 */
      -webkit-backdrop-filter: blur(40px);
      mix-blend-mode:normal; /* 避免过度变亮 */
      border-radius:12px;
      z-index:3; /* 在背景之上 */
      clip-path: polygon(
        20% 0%,   /* 左上缺角 */
        100% 0%,
        100% 80%, /* 右下缺角 */
        80% 100%,
        0% 100%,
        0% 20%
      );
    }
  </style>

  <!-- 示例：放一个在背景上看效果 -->
  <script>
    (function(){
      const layer = document.querySelector('.bg-layer');
      const el = document.createElement('div');
      el.className = 'irregular-square';
      el.style.top = '30vh';
      el.style.left = '10vw';
      layer.appendChild(el);
    })();
  </script>
</body>
</html>
