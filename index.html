<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIKO</title>
    <script>
      const VITE_MOBILE_SITE = window.__MOBILE_SITE__ || ''
      const MOBILE_MAX_SIZE = 800

      function isMobile() {
        return (
          !!navigator.userAgent.match(
            /(phone|pad|pod|iphone|ipod|ios|ipad|android|mobile|blackberry|iemobile|mqqbrowser|juc|fennec|wosbrowser|browserng|webos|symbian|windows phone)/i
          ) ||
          window?.screen?.availWidth < MOBILE_MAX_SIZE ||
          window?.innerWidth < MOBILE_MAX_SIZE
        )
      }

      function redirectMobileSite() {
        if (isMobile() && VITE_MOBILE_SITE ) {
          window.location.replace(VITE_MOBILE_SITE)
        }
      }

      redirectMobileSite()
      window.addEventListener('resize', redirectMobileSite)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="toast-root" style="pointer-events: auto;"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
